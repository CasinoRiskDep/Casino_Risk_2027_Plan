:root{
  /* Digitain dark palette (brand-specified, intentionally dark-only) */
  --bg0:#06090F; --bg1:#0A1019; --bg2:#121A29;
  --card:#182131; --card2:#111926;
  --cyan:#00D8F6; --blue:#00A3FF; --scuba:#00AABE;
  --grad:linear-gradient(135deg,#00D8F6 0%,#00A3FF 100%);
  --text:#F3F8FD; --muted:#C6D2E0; --faint:#97A9BE;
  --line:rgba(0,216,246,.30); --line-soft:rgba(255,255,255,.12);
  --f-hy:"Mardoto","Noto Sans Armenian","Sylfaen","Segoe UI",system-ui,sans-serif;
  --f-lat:"Roboto","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --f-cond:"Roboto Condensed","Roboto","Arial Narrow",Arial,sans-serif;
  --f-body:var(--f-lat);
  --f-head:var(--f-cond);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html[lang="hy"]{--f-body:var(--f-hy);--f-head:var(--f-hy)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg0)}
*,*::before,*::after{box-sizing:border-box}
body{
  height:100%;margin:0;color:var(--text);font-family:var(--f-body);font-size:16px;font-weight:500;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background:
    radial-gradient(900px 520px at 6% -6%,rgba(0,216,246,.14),transparent 62%),
    radial-gradient(820px 620px at 104% 104%,rgba(0,163,255,.12),transparent 58%),
    linear-gradient(160deg,#06090F 0%,#0A1019 46%,#121A29 100%);
  background-color:var(--bg0);
}
/* Mardoto has only Regular/Bold: give Armenian body copy extra weight with a hairline stroke */
html[lang="hy"] .t,html[lang="hy"] .tile p,html[lang="hy"] .g-sub,html[lang="hy"] .m-foot,html[lang="hy"] .kicker,html[lang="hy"] .viz-cap,html[lang="hy"] .label{-webkit-text-stroke:.35px currentColor}
::selection{background:rgba(0,216,246,.32)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:10px}

.app{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.app::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse at 30% 20%,#000 0%,transparent 70%);
          mask-image:radial-gradient(ellipse at 30% 20%,#000 0%,transparent 70%);
}

/* ───────── Header ───────── */
.top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:clamp(14px,2.2vh,22px) clamp(16px,3vw,40px)}
.brand{display:flex;align-items:center;gap:clamp(12px,1.4vw,18px);min-width:0}
.logo{width:clamp(40px,3.4vw,50px);height:clamp(40px,3.4vw,50px);flex:none;display:block;filter:drop-shadow(0 0 16px rgba(0,216,246,.4))}
.vr{width:1px;height:38px;flex:none;background:linear-gradient(transparent,rgba(0,216,246,.6),transparent)}
.titles{min-width:0}
.kicker{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="hy"] .kicker{text-transform:none;letter-spacing:.03em;font-size:14px}
.plan{margin:2px 0 0;font-family:var(--f-head);font-weight:700;font-size:clamp(19px,1.8vw,26px);line-height:1.2;letter-spacing:.01em}

.lang{position:relative;flex:none;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.35)}
.lang .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:999px;background:var(--grad);box-shadow:0 0 20px rgba(0,216,246,.5);transition:transform .38s cubic-bezier(.4,.1,.2,1)}
.lang[data-i="1"] .ind{transform:translateX(100%)}
.lang[data-i="2"] .ind{transform:translateX(200%)}
.lang button{position:relative;z-index:1;min-width:58px;padding:10px 16px;border:0;border-radius:999px;background:none;cursor:pointer;font-family:var(--f-lat);font-weight:700;font-size:13.5px;line-height:1;letter-spacing:.08em;color:var(--muted);transition:color .25s}
.lang button:hover{color:#fff}
.lang button[aria-pressed="true"]{color:#03141D}
.lang button[data-l="hy"]{font-family:var(--f-hy)}

/* ───────── Master–Detail ───────── */
.shell{position:relative;z-index:1;min-height:0;display:grid;grid-template-columns:minmax(300px,34%) minmax(0,1fr);gap:clamp(14px,1.6vw,24px);padding:0 clamp(16px,3vw,40px) clamp(16px,2.6vh,30px)}
.panel{min-height:0;display:flex;flex-direction:column;border-radius:22px;border:1px solid var(--line-soft);background:linear-gradient(180deg,var(--card),var(--card2));box-shadow:0 24px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07)}

.m-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px 12px}
.label{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
html[lang="hy"] .label{text-transform:none;letter-spacing:.04em;font-size:14px}
.pill{font:700 12.5px/1 var(--f-cond);letter-spacing:.08em;color:var(--cyan);border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:rgba(0,216,246,.08)}
.list{flex:1;min-height:0;overflow:auto;padding:4px 12px 10px;display:flex;flex-direction:column;gap:4px;scrollbar-width:thin;scrollbar-color:rgba(0,216,246,.3) transparent}
.obj{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr);align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px 12px 12px;border:1px solid transparent;border-radius:15px;background:transparent;cursor:pointer;transition:background .25s,border-color .25s,transform .25s}
.obj .n{font:700 27px/1 var(--f-cond);letter-spacing:.02em;color:#6A7F98;transition:color .25s}
.obj .t{font-size:clamp(14.5px,1.12vw,16.5px);font-weight:500;line-height:1.38;color:var(--muted);transition:color .25s}
.obj:hover{background:rgba(255,255,255,.05);transform:translateX(3px)}
.obj:hover .n{color:#A5B7CC}
.obj:hover .t{color:#fff}
.obj[aria-selected="true"]{background:linear-gradient(90deg,rgba(0,216,246,.20),rgba(0,163,255,.05));border-color:var(--line);transform:none}
.obj[aria-selected="true"]::before{content:"";position:absolute;left:-1px;top:14%;bottom:14%;width:3px;border-radius:3px;background:var(--grad);box-shadow:0 0 14px rgba(0,216,246,.85)}
.obj[aria-selected="true"] .n{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.obj[aria-selected="true"] .t{color:#fff;font-weight:700}
.m-foot{padding:12px 22px 16px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--faint)}
.m-foot b{font-weight:700;color:var(--muted)}

.d-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 26px 0}
.d-label{display:flex;align-items:center;gap:10px;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px 2px rgba(0,216,246,.7)}
.d-nav{display:flex;align-items:center;gap:8px}
.count{font:700 14px/1 var(--f-cond);letter-spacing:.1em;color:var(--muted);margin-right:6px;white-space:nowrap}
.count b{color:var(--cyan);font-weight:700}
.nb{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:rgba(0,216,246,.08);cursor:pointer;color:var(--cyan);transition:background .2s,transform .2s,opacity .2s}
.nb:hover:not(:disabled){background:rgba(0,216,246,.2);transform:scale(1.06)}
.nb:disabled{opacity:.3;cursor:default}
.nb svg{width:18px;height:18px}
.prog{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:16px 26px 0}
.prog i{height:4px;border-radius:4px;background:rgba(255,255,255,.12);transition:background .35s,box-shadow .35s}
.prog i.on{background:var(--grad);box-shadow:0 0 10px rgba(0,216,246,.6)}
.d-scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;container-type:inline-size;container-name:dsc;padding:18px 26px 24px;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:rgba(0,216,246,.3) transparent}

.d-title{flex:none;display:flex;align-items:flex-start;gap:clamp(14px,1.8vw,24px);margin-bottom:clamp(12px,2vh,20px);animation:rise .5s both}
.big{flex:none;font:700 clamp(54px,5.2vw,80px)/.9 var(--f-cond);letter-spacing:-.01em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 22px rgba(0,216,246,.3))}
.d-title h2{margin:0;padding-top:3px;font-family:var(--f-head);font-weight:700;font-size:clamp(22px,2.3vw,34px);line-height:1.18;letter-spacing:.005em}
.d-title.long h2{font-size:clamp(20px,1.95vw,29px)}

/* ───────── Stage = visual + linked tiles ───────── */
.stage{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.viz{position:relative;margin:0;display:flex;flex-direction:column;border-radius:20px;border:1px solid var(--line);background:radial-gradient(120% 80% at 50% 0%,rgba(0,216,246,.13),transparent 62%),linear-gradient(180deg,#141D2B,#0D1420);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 44px rgba(0,0,0,.4);padding:10px 10px 8px;overflow:hidden;animation:rise .55s both}
.viz svg{display:block;width:100%;height:auto;overflow:visible}
.viz-cap{padding:0 8px 2px;font-size:12.5px;font-weight:500;color:var(--faint);text-align:center}

.tiles{display:grid;grid-template-columns:1fr;grid-auto-rows:auto;gap:10px;align-content:start}
.tile{position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:baseline;gap:4px 14px;padding:15px 18px 16px;border-radius:15px;border:1px solid var(--line-soft);background:linear-gradient(180deg,#1D2738,#161F2D);box-shadow:0 8px 22px rgba(0,0,0,.28);animation:rise .5s both;animation-delay:calc(var(--i,0)*70ms + 120ms);transition:border-color .25s,transform .25s,box-shadow .25s,opacity .25s,background .25s}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad);opacity:.55;transition:opacity .25s}
.tile:hover,.tile:focus-visible{border-color:var(--line);transform:translateX(3px)}
.tile:hover::before{opacity:1}
.idx{display:inline-block;grid-column:1;grid-row:1;font:700 14px/1 var(--f-cond);letter-spacing:.12em;color:var(--cyan)}
.tile h3{grid-column:2;margin:0;font-family:var(--f-head);font-weight:700;font-size:clamp(17px,1.45vw,21px);line-height:1.28;color:#fff}
.tile p{grid-column:2;margin:2px 0 0;font-size:clamp(14px,1.08vw,15.5px);font-weight:500;line-height:1.5;color:var(--muted)}
.flag{grid-column:1;grid-row:1;display:inline-flex;align-items:center;font-size:12px;font-weight:700;color:var(--cyan)}
.flag svg{width:17px;height:17px}
.flag span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* linked highlighting between visual and tiles */
.v-k{cursor:pointer;transition:opacity .25s,filter .25s}
.stage[data-act] .v-k{opacity:.3}
.stage[data-act] .tile{opacity:.55}
.stage[data-act="1"] :is(.v-k,.tile)[data-k="1"],
.stage[data-act="2"] :is(.v-k,.tile)[data-k="2"],
.stage[data-act="3"] :is(.v-k,.tile)[data-k="3"],
.stage[data-act="4"] :is(.v-k,.tile)[data-k="4"]{opacity:1}
.stage[data-act="1"] .v-k[data-k="1"],
.stage[data-act="2"] .v-k[data-k="2"],
.stage[data-act="3"] .v-k[data-k="3"],
.stage[data-act="4"] .v-k[data-k="4"]{filter:drop-shadow(0 0 9px rgba(0,216,246,.8))}
.stage[data-act="1"] .tile[data-k="1"],
.stage[data-act="2"] .tile[data-k="2"],
.stage[data-act="3"] .tile[data-k="3"],
.stage[data-act="4"] .tile[data-k="4"]{border-color:var(--cyan);background:linear-gradient(135deg,rgba(0,216,246,.26),rgba(0,163,255,.09));transform:translateX(5px);box-shadow:0 0 0 1px rgba(0,216,246,.35),0 14px 34px rgba(0,0,0,.45),0 0 26px rgba(0,216,246,.18)}
.stage[data-act="1"] .tile[data-k="1"]::before,
.stage[data-act="2"] .tile[data-k="2"]::before,
.stage[data-act="3"] .tile[data-k="3"]::before,
.stage[data-act="4"] .tile[data-k="4"]::before{opacity:1}

/* ───────── SVG visual vocabulary ───────── */
.viz svg text{font-family:var(--f-cond)}
.v-node{fill:#0E1A27;stroke:#00D8F6;stroke-width:2}
.v-soft{fill:rgba(255,255,255,.055);stroke:rgba(255,255,255,.26);stroke-width:1.4}
.v-line{fill:none;stroke:rgba(0,216,246,.4);stroke-width:2.2}
.v-flow{fill:none;stroke:#00D8F6;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:2 10;animation:flow 1.2s linear infinite}
.v-txt{fill:#F3F8FD;font-weight:700;font-size:17px;text-anchor:middle;dominant-baseline:central;letter-spacing:.05em}
.v-txt.dark{fill:#03141D;font-size:30px}
.v-ico{fill:none;stroke:#00D8F6;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.v-ico.dark{stroke:#03141D;stroke-width:2.2}
.v-icoF{fill:#00D8F6;stroke:none}
.v-orbit{fill:none;stroke:rgba(0,216,246,.3);stroke-width:1.3;stroke-dasharray:3 8;transform-origin:210px 190px;animation:spin 70s linear infinite}
.v-spin{transform-origin:210px 190px;animation:spin 16s linear infinite}
.v-halo{fill:none;stroke:rgba(0,216,246,.6);stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:halo 2.8s ease-out infinite}
.v-pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
.v-gear{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
.v-arc{fill:none;stroke-width:24;stroke-dasharray:48.3 100;animation:draw 1.5s cubic-bezier(.3,.7,.2,1) both}
.v-dot{fill:var(--c);animation:sort 9s cubic-bezier(.65,0,.35,1) infinite both}
.v-bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 9s cubic-bezier(.5,0,.2,1) infinite both}
.v-grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow2 5s cubic-bezier(.5,0,.2,1) infinite both}
.v-seat{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--n,0)*55ms + 350ms)}
.v-ghost{fill:none;stroke:rgba(0,216,246,.7);stroke-width:1.6;stroke-dasharray:3 4;animation:ghost 3.2s ease-in-out infinite}
.v-sla{fill:none;stroke:url(#gCy);stroke-width:7;stroke-linecap:round;animation:sla 6s ease-in-out infinite both}
.v-block{animation:blocks 6s ease-in-out infinite both;animation-delay:calc(var(--b,0)*140ms)}

.v-icoW{fill:#fff;stroke:none}
.v-think{animation:think 1.4s ease-in-out infinite;animation-delay:calc(var(--d)*.22s)}
@keyframes think{0%,100%{opacity:.25}50%{opacity:1}}
.d-title.xlong h2{font-size:clamp(18px,1.7vw,26px)}
.stage.text-heavy{grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr)}
.stage.text-heavy .tile p{grid-column:1/-1;margin-top:6px;font-size:clamp(13.5px,1.02vw,15px);line-height:1.48}
.v-lbl{font-family:var(--f-body)!important;font-size:15px;font-weight:700;fill:#F3F8FD;text-anchor:middle;dominant-baseline:central;letter-spacing:.02em}
.v-lbl.dept{font-size:15.5px}
.v-lbl.u{font-size:14px;letter-spacing:.01em}
html[lang="hy"] .v-lbl.u{font-size:13px;letter-spacing:0}
html[lang="hy"] .v-lbl.dept{font-size:15px}
.v-lbl.sm{font-size:13px;font-weight:500;fill:#C6D2E0}
.v-sl{transform-box:fill-box;transform-origin:center;animation:splitL 1.1s cubic-bezier(.3,1.1,.4,1) .15s backwards}
.v-sr{transform-box:fill-box;transform-origin:center;animation:splitR 1.1s cubic-bezier(.3,1.1,.4,1) .15s backwards}
.v-pop{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(var(--n)*130ms + 950ms)}
@keyframes splitL{from{transform:translateX(70px) scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes splitR{from{transform:translateX(-70px) scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes halo{0%{transform:scale(.88);opacity:.95}100%{transform:scale(1.45);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.14);opacity:.8}}
@keyframes draw{from{stroke-dashoffset:48.3}to{stroke-dashoffset:0}}
@keyframes sort{
  0%,8%{transform:translate(var(--dx),var(--dy));fill:rgba(255,255,255,.6)}
  36%,64%{transform:none;fill:var(--c)}
  92%,100%{transform:translate(var(--dx),var(--dy));fill:rgba(255,255,255,.6)}
}
@keyframes grow{0%,34%{transform:scaleY(.1)}56%,90%{transform:scaleY(1)}100%{transform:scaleY(.1)}}
@keyframes grow2{0%{transform:scaleY(.15)}45%,85%{transform:scaleY(1)}100%{transform:scaleY(.15)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes ghost{0%,100%{opacity:.85}50%{opacity:.25}}
@keyframes sla{0%,12%{stroke-dasharray:92 100}55%,100%{stroke-dasharray:34 100}}
@keyframes blocks{0%,10%{opacity:1}40%,85%{opacity:.14}100%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fillm{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ───────── Objective 05: two sub-points ───────── */
.groups{flex:0 1 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch}
.group{display:flex;flex-direction:column;padding:16px 16px 18px;border-radius:19px;border:1px solid var(--line-soft);background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));animation:rise .5s both;animation-delay:calc(var(--g,0)*110ms + 60ms)}
.g-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-bottom:4px}
.g-no{font:700 14px/1 var(--f-cond);letter-spacing:.1em;color:#03141D;background:var(--grad);border-radius:8px;padding:6px 9px}
.g-ic{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:rgba(0,216,246,.08);color:var(--cyan)}
.g-ic svg{width:18px;height:18px}
.group h3{margin:0;font-family:var(--f-head);font-weight:700;font-size:clamp(17px,1.45vw,21px);line-height:1.25}
.chip{font-size:12.5px;font-weight:700;letter-spacing:.05em;color:var(--cyan);border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:rgba(0,216,246,.09);white-space:nowrap}
.g-sub{margin:6px 0 0;font-size:14px;font-weight:500;line-height:1.5;color:var(--muted)}
.group .tiles{margin-top:12px}
.group .tile{animation-delay:calc(var(--g,0)*110ms + var(--i,0)*70ms + 160ms)}
.year{grid-column:1/-1;margin-top:26px}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.m{position:relative;text-align:center;cursor:default}
.m i{display:block;height:9px;border-radius:3px;background:var(--grad);box-shadow:0 0 10px rgba(0,216,246,.45);transform-origin:left;animation:fillm .5s both;animation-delay:calc(var(--m)*70ms + 450ms);transition:transform .2s,filter .2s}
.m:hover i{filter:brightness(1.3);transform:scaleY(1.7)}
.m b{display:block;margin-top:6px;font:700 12px/1 var(--f-cond);color:var(--muted)}
.pin{position:absolute;left:-1px;top:-24px;width:18px;height:18px;color:var(--cyan);animation:pulse 2.4s ease-in-out infinite}

/* ───────── Responsive ───────── */
@container dsc (max-width:700px){
  .stage,.stage.text-heavy{grid-template-columns:1fr}
  .viz svg{max-width:440px;margin:0 auto}
  .stage:not(.text-heavy) .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .groups{grid-template-columns:1fr}
}
.tile h3,.tile p,.g-sub{overflow-wrap:break-word}
@container dsc (max-width:400px){
  .tile h3,.group h3{font-size:15.5px}
}
@container dsc (max-width:470px){
  .stage .tiles,.stage:not(.text-heavy) .tiles{grid-template-columns:1fr}
}
@media (max-width:1100px){
  .shell{grid-template-columns:minmax(260px,38%) minmax(0,1fr)}
}
@media (max-width:960px){
  html,body{height:auto;min-height:100%}
  .app{height:auto;display:block;min-height:100vh}
  .shell{display:block;padding-bottom:24px}
  .panel{margin-bottom:16px}
  .list{overflow:visible}
  .d-scroll{overflow:visible}
  .obj:hover{transform:none}
}
@media (max-width:640px){
  .top{flex-wrap:wrap;gap:12px}
  .kicker{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.3}
  .vr{display:none}
  .lang{margin-left:auto}
  .lang button{min-width:50px;padding:9px 12px}
  .d-head{gap:10px}
  .count{margin-right:2px}
  .d-head,.prog,.d-scroll{padding-left:18px;padding-right:18px}
  .d-title{flex-direction:column;gap:6px}
  .big{font-size:60px}
  .m-head{padding:18px 18px 10px}
  .m-foot{display:none}
}
/* ───────── Laptop screens: keep every objective on one screen ───────── */
@media (min-width:961px) and (max-height:920px){
  .top{padding-top:12px;padding-bottom:12px}
  .m-head{padding:16px 22px 8px}
  .obj{padding:9px 12px 9px 10px}
  .obj .n{font-size:24px}
  .m-foot{padding:9px 22px 11px}
  .d-head{padding-top:15px}
  .prog{padding-top:12px}
  .d-scroll{padding-top:14px;padding-bottom:16px}
  .d-title{margin-bottom:12px}
  .tile{padding:12px 16px 13px}
  .tiles{gap:8px}
  .group{padding:13px 14px 15px}
  .group .tiles{margin-top:8px}
  .shell{padding-bottom:16px}
}
@media (min-width:961px) and (max-height:800px){
  .top{padding-top:8px;padding-bottom:8px}
  .logo{width:38px;height:38px}
  .plan{font-size:clamp(17px,1.5vw,21px)}
  .kicker{font-size:11.5px}
  .m-head{padding:12px 20px 6px}
  .obj{padding:6px 12px 6px 10px;gap:8px;grid-template-columns:42px minmax(0,1fr)}
  .obj .n{font-size:21px}
  .obj .t{font-size:clamp(13px,.98vw,14.5px);line-height:1.28}
  .list{gap:2px}
  .m-foot{display:none}
  .d-head{padding-top:11px}
  .prog{padding-top:9px}
  .d-scroll{padding-top:10px;padding-bottom:12px}
  .big{font-size:clamp(44px,4.2vw,60px)}
  .d-title{margin-bottom:9px}
  .d-title h2{font-size:clamp(19px,1.9vw,27px)}
  .d-title.long h2,.d-title.xlong h2{font-size:clamp(17px,1.6vw,23px)}
  .tile{padding:9px 14px 10px}
  .tile h3{font-size:clamp(15.5px,1.25vw,18px)}
  .tile p,.stage.text-heavy .tile p{font-size:clamp(12.5px,.95vw,14px);line-height:1.4}
  .tiles{gap:6px}
  .viz{padding:6px 8px 4px}
  .viz-cap{display:none}
  .group{padding:10px 12px 12px}
  .g-head{margin-bottom:2px}
  .g-sub{font-size:13px;margin-top:3px}
  .group .tiles{margin-top:6px}
  .year{margin-top:20px}
  .shell{padding-bottom:10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">

    opts = opts || {};
    i = Math.max(0, Math.min(ITEMS.length - 1, i));
    var changed = i !== state.idx;
    state.idx = i;
    renderState();
    if (changed || opts.force) renderDetail();
    var tab = $('tab-' + (i + 1));
    if (tab) {
      if (opts.focus) tab.focus({ preventScroll: true });
      tab.scrollIntoView({ block: 'nearest' });
    }
    if (opts.reveal && window.matchMedia('(max-width: 960px)').matches) {
      $('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function setLang(l) {
    if (LANGS.indexOf(l) < 0) return;
    state.lang = l;
    store('digitain-risk-lang', l);
    renderChrome();
    renderList();
    renderDetail();
  }

  /* ───────── Events ───────── */
  $('list').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.obj') : null;
    if (b) select(parseInt(b.getAttribute('data-i'), 10), { reveal: true });
  });

  $('lang').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button[data-l]') : null;
    if (b) setLang(b.getAttribute('data-l'));
  });

  $('prev').addEventListener('click', function () { select(state.idx - 1); });
  $('next').addEventListener('click', function () { select(state.idx + 1); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key, target = null;
    if (k === 'ArrowDown' || k === 'ArrowRight') target = state.idx + 1;
    else if (k === 'ArrowUp' || k === 'ArrowLeft') target = state.idx - 1;
    else if (k === 'Home') target = 0;
    else if (k === 'End') target = ITEMS.length - 1;
    else if (/^[1-8]$/.test(k)) target = parseInt(k, 10) - 1;
    if (target === null) return;
    e.preventDefault();
    var inList = $('list').contains(document.activeElement);
    select(target, { focus: inList });
  });

  /* swipe between objectives on touch screens */
  (function () {
    var x0 = 0, y0 = 0, t0 = 0;
    var area = $('dbody');
    area.addEventListener('touchstart', function (e) {
      var t = e.changedTouches[0]; x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
    }, { passive: true });
    area.addEventListener('touchend', function (e) {
      var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
      if (Date.now() - t0 < 700 && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) {
        select(state.idx + (dx < 0 ? 1 : -1));
      }
    }, { passive: true });
  })();

  function fromHash() {
    var m = /^#goal-([1-8])$/.exec(location.hash || '');
    return m ? parseInt(m[1], 10) - 1 : null;
  }
  window.addEventListener('hashchange', function () {
    var i = fromHash();
    if (i !== null && i !== state.idx) select(i);
  });

  /* ───────── Init ───────── */
  var saved = recall('digitain-risk-lang');
  if (saved && LANGS.indexOf(saved) >= 0) state.lang = saved;
  var h = fromHash();
  if (h !== null) state.idx = h;
  renderChrome();
  renderList();
  renderDetail();
  renderState();
})();
</script>
</body>
</html>
